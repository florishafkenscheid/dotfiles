################
### MONITORS ###
################

monitorv2 {
  output = DP-2
  mode = 3840x2160@240
  position = 3840x0
  scale = 1

  bitdepth = 10
  cm = srgb
}

monitorv2 {
  output = HDMI-A-1
  mode = 3840x2160@60
  position = 0x0
  scale = 1
}

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$browser = /home/blousy/.config/desktop/launch-zen
$discord = /usr/bin/mullvad-exclude /home/blousy/.config/desktop/launch-vesktop

#################
### AUTOSTART ###
#################

exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = mako
exec-once = hypridle
exec-once = clipse -listen
exec-once = hyprsunset
exec-once = qs -c blousy
exec-once = openrgb -p Black

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Keep atomic modesetting enabled on modern AMD; forcing it off can cause
# bad presentation behavior with high-refresh nested fullscreen apps.

